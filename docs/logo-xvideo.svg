<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.20"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="40"/>

  <!-- Aurora orbs -->
  <circle cx="140" cy="120" r="180" fill="url(#aurora1)" opacity="0.6"/>
  <circle cx="260" cy="280" r="160" fill="url(#aurora2)" opacity="0.5"/>

  <!-- Glass frame -->
  <rect x="60" y="60" width="280" height="280" rx="40" fill="url(#frameGrad)" stroke="rgba(99,102,241,0.2)" stroke-width="1.5"/>

  <!-- Glass reflection -->
  <rect x="60" y="60" width="280" height="100" rx="40" fill="rgba(255,255,255,0.02)"/>

  <!-- Accent bar top -->
  <rect x="60" y="60" width="280" height="4" rx="2" fill="url(#xGrad)"/>

  <!-- X mark -->
  <g filter="url(#glow)">
    <!-- Left stroke -->
    <line x1="120" y1="130" x2="280" y2="270" stroke="url(#xGrad)" stroke-width="32" stroke-linecap="round" opacity="0.95"/>
    <!-- Right stroke -->
    <line x1="280" y1="130" x2="120" y2="270" stroke="url(#xGrad)" stroke-width="32" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- X inner highlight -->
  <line x1="125" y1="135" x2="275" y2="265" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-linecap="round"/>
  <line x1="275" y1="135" x2="125" y2="265" stroke="rgba(255,255,255,0.08)" stroke-width="8" stroke-linecap="round"/>

  <!-- Glass shine -->
  <ellipse cx="160" cy="120" rx="120" ry="80" fill="rgba(255,255,255,0.02)" transform="rotate(-15, 160, 120)"/>

  <!-- X dot at intersection -->
  <circle cx="200" cy="200" r="6" fill="#a78bfa" filter="url(#glow)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom accent bar -->
  <rect x="160" y="310" width="80" height="2" rx="1" fill="url(#xGrad)" opacity="0.5"/>
</svg>
