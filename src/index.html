<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>X-Video Studio — AI World</title>
  <style>
    body {
      margin:0;padding:0;
      background:#030712;
      display:flex;align-items:center;justify-content:center;
      height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:#e2e8f0;
    }
    .loader { text-align:center; }
    .spinner { 
      width:40px;height:40px;
      border:3px solid rgba(99,102,241,0.15);
      border-top-color:#6366f1;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      margin:20px auto;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    h2 { font-size:18px; font-weight:600; color:#a78bfa; margin-bottom:8px; }
    p { font-size:13px; color:rgba(148,163,184,0.6); }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>Kết nối X-Video Server...</h2>
    <p>Nếu không tự động chuyển, <a id="link" style="color:#6366f1;text-decoration:none;">bấm vào đây</a></p>
  </div>
  <script>
    // Auto-redirect to the web app (the server is already running)
    const BACKEND = 'http://192.168.1.12:8767';
    document.getElementById('link').href = BACKEND;
    
    fetch(BACKEND + '/healthz', { timeout: 3000 })
      .then(r => r.json())
      .then(d => { if (d.status === 'ok') window.location.href = BACKEND; })
      .catch(() => {
        // Fallback: try localhost
        fetch('http://localhost:8767/healthz', { timeout: 3000 })
          .then(r => r.json())
          .then(d => { if (d.status === 'ok') window.location.href = 'http://localhost:8767'; })
          .catch(() => { /* offline mode placeholder */ });
      });
  </script>
</body>
</html>
