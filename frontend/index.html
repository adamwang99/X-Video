<script>
// ===== X-Video Wizard App (v1.27.7) — rewritten by Tiep QSO =====
var ST = {
  step: 1,
  mode: "url",        // url | text
  url: "",
  title: "",
  content: "",
  style: "news",
  aspect: "doc",
  resolution: "hd",
  voice: "female_south",
  music: "ambient",
  length: 0,
  rewriteStyle: "news",
  jobId: "",
  voices: [],
  bgms: [],
  llmProvider: "local_ollama",
  llmModel: "",
  llmBaseUrl: "",
  llmProviders: [],
  extractMode: "local"
};

function $(id){return document.getElementById(id);}
function escH(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

var STYLES=[["news","📺 Bản tin"],["reportage","🎬 Phóng sự"],["analysis","📊 Phân tích"],["story","📖 Kể chuyện"],["hot","🔥 Tin nóng"]];
var ASPECTS=[["doc","📱 Dọc 9:16"],["ngang","🖥️ Ngang 16:9"],["vuong","⬛ Vuông 1:1"]];
var RESOS=[["hd","HD 720"],["fhd","FHD 1080"],["2k","2K"],["4k","4K"]];
var LENGTHS=[[0,"Auto"],[30,"~30s"],[60,"~1 phút"],[90,"~1.5 phút"],[120,"~2 phút"],[180,"~3 phút"]];
function chips(arr,cur,fn){
  return arr.map(function(o){
    var on=String(o[0])===String(cur);
    return '<button onclick="'+fn+'(\''+o[0]+'\')" class="px-3 py-2 rounded-lg text-[12px] font-semibold border transition" style="'+(on?'border-color:rgba(103,221,255,.65);background:rgba(103,221,255,.12);color:#67ddff':'border-color:rgba(255,255,255,.12);color:#bbc9cc')+'">'+o[1]+'</button>';
  }).join('');
}


function setStep(n){
  captureLive();
  ST.step=n;
  saveProgress("checkpoint");
  $("stepHint").textContent="Bước "+n+"/4 · "+["","Nguồn nội dung","Duyệt nội dung","Cấu hình","Phân cảnh & Ghép"][n];
  document.querySelectorAll(".step-dot").forEach(function(d){
    var s=parseInt(d.getAttribute("data-s"));
    d.style.color = s===n ? "#44d8f1" : (s<n?"#5ee3a1":"#bbc9cc");
    d.style.fontWeight = s===n ? "800" : "500";
  });
  render();
}

function toast(msg,err){
  var t=$("xvToast");
  if(!t){t=document.createElement("div");t.id="xvToast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9998;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;backdrop-filter:blur(10px);max-width:80vw;text-align:center";document.body.appendChild(t);}
  t.style.background=err?"rgba(255,141,161,.18)":"rgba(94,227,161,.18)";
  t.style.border="1px solid "+(err?"rgba(255,141,161,.5)":"rgba(94,227,161,.5)");
  t.style.color=err?"#ffb4ab":"#5ee3a1";
  t.textContent=msg; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(function(){t.style.display="none";},4000);
}

var STORE_KEY="xvideo.progress.current";
var HIST_KEY="xvideo.progress.history";
function captureLive(){
  if($("srcUrl"))ST.url=$("srcUrl").value;
  if($("srcText"))ST.content=$("srcText").value;
  if($("edTitle"))ST.title=$("edTitle").value;
  if($("edContent"))ST.content=$("edContent").value;
  if($("cfgVoice"))ST.voice=$("cfgVoice").value;
  if($("cfgMusic"))ST.music=$("cfgMusic").value;
}
function snapshot(){captureLive();return JSON.parse(JSON.stringify({ts:new Date().toISOString(),state:ST}));}
function saveProgress(reason){
  try{var snap=snapshot();localStorage.setItem(STORE_KEY,JSON.stringify(snap));
    var h=JSON.parse(localStorage.getItem(HIST_KEY)||"[]");
    if(reason==="checkpoint"||!h.length||Date.now()-Date.parse(h[0].ts)>60000){h.unshift(snap);h=h.slice(0,20);localStorage.setItem(HIST_KEY,JSON.stringify(h));}
  }catch(e){}
}
function restoreSnap(snap){if(!snap||!snap.state)return;ST=Object.assign(ST,snap.state);setStep(ST.step||1);toast("Đã restore tiến trình");}
function restoreLatest(){try{var s=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s)restoreSnap(s);}catch(e){}}
function exportProgress(){saveProgress("checkpoint");var data=localStorage.getItem(STORE_KEY)||JSON.stringify(snapshot());var blob=new Blob([data],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="xvideo-progress-"+(new Date().toISOString().replace(/[:.]/g,"-"))+".json";a.click();URL.revokeObjectURL(a.href);}
function showHistory(){
  var h=[];try{h=JSON.parse(localStorage.getItem(HIST_KEY)||"[]");}catch(e){}
  var html='<div class="help-overlay on" id="histOverlay"><div class="glass-panel rounded-xl p-md" style="width:min(720px,92vw);max-height:80vh;overflow:auto">'+
    '<div class="flex justify-between items-center mb-3"><h2 class="text-headline-md font-bold">Lịch sử tiến trình</h2><button onclick="$(\'histOverlay\').remove()" class="px-3 py-1 rounded-full border border-white/15">Đóng</button></div>';
  if(!h.length)html+='<p class="text-[12px] text-on-surface-variant">Chưa có lịch sử.</p>';
  h.forEach(function(x,i){var st=x.state||{};html+='<div class="p-3 mb-2 rounded-lg" style="border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)"><div class="text-[12px] font-bold">'+escH(st.title||st.url||"Chưa đặt tên")+'</div><div class="text-[10px] text-on-surface-variant">'+x.ts+' · bước '+(st.step||1)+' · '+((st.content||"").split(/\s+/).filter(Boolean).length)+' từ</div><button class="mt-2 px-3 py-1 rounded-full border border-white/15 text-[11px]" onclick="restoreSnap(JSON.parse(localStorage.getItem(\'HIST_KEY_TMP_\'+ '+i+'))) ">Restore</button></div>';localStorage.setItem('HIST_KEY_TMP_'+i,JSON.stringify(x));});
  html+='</div></div>';document.body.insertAdjacentHTML('beforeend',html);
}
setInterval(function(){saveProgress();},2000);
window.addEventListener("beforeunload",function(){saveProgress("checkpoint")});
document.addEventListener("visibilitychange",function(){if(document.hidden)saveProgress("checkpoint")});
document.addEventListener("input",function(e){
  var t=e.target;if(!t)return;
  if(t.id==="srcUrl"||t.id==="srcText"||t.id==="edTitle"||t.id==="edContent"||t.classList.contains("sb-headline")||t.classList.contains("sb-text")){saveProgress();}
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t)return;
  if(t.id==="cfgVoice"||t.id==="cfgMusic"||t.classList.contains("sb-template")||t.classList.contains("sb-visual")||t.classList.contains("sb-motion")||t.classList.contains("sb-asset")){saveProgress("checkpoint");}
});
setTimeout(function(){try{var s=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); if(s&&s.state&&(s.state.content||s.state.url)&&!ST.content&&!ST.url){toast("Có tiến trình cũ · bấm Lịch sử để restore");}}catch(e){}},800);

// ---- main render router ----
function render(){
  var r=$("wizardRoot");
  if(ST.step===1) r.innerHTML=viewStep1();
  else if(ST.step===2) r.innerHTML=viewStep2();
  else if(ST.step===3) r.innerHTML=viewStep3();
  else if(ST.step===4) r.innerHTML=viewStep4();
  if(ST.step===4) loadStoryboard();
}

          '<div class="flex flex-wrap gap-2 mb-2">'+
            '<button onclick="setExtractMode(\'local\')" class="px-3 py-2 rounded-lg text-[12px] font-semibold border" style="'+(ST.extractMode==="local"?'border-color:rgba(68,216,241,.6);background:rgba(68,216,241,.1);color:#44d8f1':'border-color:rgba(255,255,255,.12);color:#bbc9cc')+'">⚙️ Local parser</button>'+
            '<button onclick="setExtractMode(\'llm\')" class="px-3 py-2 rounded-lg text-[12px] font-semibold border" style="'+(ST.extractMode==="llm"?'border-color:rgba(68,216,241,.6);background:rgba(68,216,241,.1);color:#44d8f1':'border-color:rgba(255,255,255,.12);color:#bbc9cc')+'">🧠 LLM làm sạch nội dung</button>'+
          '</div>'+
          '<div class="text-[10px] text-on-surface-variant mb-2">Local = nhanh, deterministic. LLM = dùng provider đã chọn để bóc phần bài viết chính, bỏ menu/rác/ads.</div>'+
          (ST.extractMode==="llm"?llmPickerHtml("s1"):"")+
        '</div>'
      : '<textarea id="srcText" class="glass-input w-full" rows="7" style="font-size:13px" placeholder="Dán nội dung muốn tạo video...">'+escH(ST.content)+'</textarea>')+
    '<div class="flex justify-end mt-4">'+
      '<button onclick="step1Next()" id="s1btn" class="btn-shine bg-primary text-black font-bold py-2.5 px-7 rounded-full text-[13px] neon-glow-primary hover:bg-primary-fixed">Tiếp tục →</button>'+
    '</div>'+
  '</div>';
}
function setMode(m){
  if(ST.mode==="url"&&$("srcUrl"))ST.url=$("srcUrl").value;
  if(ST.mode==="text"&&$("srcText"))ST.content=$("srcText").value;
  ST.mode=m; render();
}
function setExtractMode(m){
  if($("srcUrl"))ST.url=$("srcUrl").value;
  ST.extractMode=m;
  render();
}
function step1Next(){
  var btn=$("s1btn");
  if(ST.mode==="url"){
    ST.url=$("srcUrl").value.trim();
    if(!ST.url)return toast("Dán link bài viết",1);
    btn.disabled=true;btn.innerHTML=(ST.extractMode==="llm"?"Đang đọc + làm sạch bằng LLM...":"Đang đọc...");
    var body=Object.assign({url:ST.url,extract_mode:ST.extractMode||"local"},llmBody());
    fetch("/api/prefetch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      ST.title=d.title||""; ST.content=d.content||d.excerpt||"";
      toast("Đã lấy nội dung · "+(d.extract_used||ST.extractMode)+" · "+(d.word_count||0)+" từ");
      setStep(2);
    }).catch(function(e){btn.disabled=false;btn.innerHTML="Tiếp tục →";toast("Lỗi đọc: "+e.message,1);});
  }else{
    ST.content=$("srcText").value.trim();
    if(!ST.content)return toast("Nhập nội dung",1);
    ST.title=ST.content.split("\n")[0].slice(0,120);
    setStep(2);
  }
}

function updWc(){var t=$("edContent").value.trim();$("wcLabel").textContent=(t?t.split(/\s+/).length:0)+" từ";}
function step2Next(){
  ST.title=$("edTitle").value.trim();
  ST.content=$("edContent").value.trim();
  if(!ST.content)return toast("Nội dung trống",1);
  setStep(3);
}
function setRwStyle(v){ST.content=$("edContent")?$("edContent").value:ST.content;ST.title=$("edTitle")?$("edTitle").value:ST.title;ST.rewriteStyle=v;render();}
function setLength(v){ST.content=$("edContent")?$("edContent").value:ST.content;ST.title=$("edTitle")?$("edTitle").value:ST.title;ST.length=parseInt(v);render();}
function doRewrite(rnd){
  ST.title=$("edTitle")?$("edTitle").value.trim():ST.title;
  ST.content=$("edContent")?$("edContent").value.trim():ST.content;
  if(!ST.content)return toast("Nội dung trống",1);
  var b=$("rwBtn"),br=$("rwRnd");
  if(b){b.disabled=true;b.innerHTML="✨ Đang viết lại...";}
  if(br)br.disabled=true;
  fetch("/api/rewrite",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({text:ST.content,title:ST.title,style:ST.rewriteStyle,length:ST.length,random:!!rnd},llmBody()))})
    .then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      ST.content=d.text;
      if(d.style){ST.rewriteStyle=d.style;ST.style=d.style;}
      render();
      toast("✨ Đã viết lại · "+d.word_count+" từ · "+(d.style||"")+(rnd?" 🎲":""));
    }).catch(function(e){toast("Lỗi viết lại: "+e.message,1);
      var bb=$("rwBtn");if(bb){bb.disabled=false;bb.innerHTML="✨ Viết lại";}var bbr=$("rwRnd");if(bbr)bbr.disabled=false;});
}

function setStyle(v){ST.style=v;saveProgress("checkpoint");render();}
function setAspect(v){ST.aspect=v;saveProgress("checkpoint");render();}
function setReso(v){ST.resolution=v;saveProgress("checkpoint");render();}
function setVoice(v){ST.voice=v;try{localStorage.setItem("xvideo:lastVoice",v);}catch(e){};saveProgress("checkpoint");}

function step3Next(){
  var btn=$("s3btn");btn.disabled=true;btn.innerHTML="Đang tạo phân cảnh...";
  var payload={
    voice:ST.voice, aspect:ST.aspect, style:ST.style, resolution:ST.resolution,
    music:ST.music, target_length:ST.length||0, language:(ST.voice.indexOf("female")===0||ST.voice.indexOf("male")===0)?"vi":"en",
    use_stock:false, review_storyboard:true
  };
  if(ST.mode==="url" && ST.url && ST.content===ST._origContent){ payload.url=ST.url; }
  else { payload.text=(ST.title?ST.title+"\n":"")+ST.content; if(ST.url)payload.image_url=ST.url; }
  fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
    .then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      ST.jobId=d.job_id;
      saveProgress("checkpoint");
      pollStoryboardReady();
    }).catch(function(e){btn.disabled=false;btn.innerHTML="Tạo phân cảnh →";toast("Lỗi: "+e.message,1);});
}
function pollStoryboardReady(){
  var t0=Date.now();
  var iv=setInterval(function(){
    if(Date.now()-t0>120000){clearInterval(iv);toast("Quá thời gian tạo phân cảnh",1);if($("s3btn")){$("s3btn").disabled=false;$("s3btn").innerHTML="Tạo phân cảnh →";}return;}
    fetch("/api/jobs/"+ST.jobId).then(function(r){return r.json()}).then(function(j){
      if(j.status==="storyboard_ready"){clearInterval(iv);setStep(4);}
      else if(j.status==="error"){clearInterval(iv);toast(j.error||"Lỗi tạo phân cảnh",1);if($("s3btn")){$("s3btn").disabled=false;$("s3btn").innerHTML="Tạo phân cảnh →";}}
    }).catch(function(){});
  },2500);
}

var HV_TEMPLATES=[];
function hvLoadTemplates(cb){
  if(HV_TEMPLATES.length){if(cb)cb();return;}
  fetch("/api/hv/templates?aspect=9:16").then(function(r){return r.json()}).then(function(d){
    HV_TEMPLATES=(d&&d.templates)||[];if(cb)cb();
  }).catch(function(){if(cb)cb();});
}
function hvTemplateOptions(sel){
  var isConcrete=sel&&sel!=="random";
  var def='<option value="random"'+((!sel||sel==="random")?" selected":"")+'>🎲 Ngẫu nhiên</option>';
  var found=false;
  var opts=HV_TEMPLATES.map(function(t){
    var on=(t.id===sel); if(on)found=true;
    return '<option value="'+t.id+'" '+(on?"selected":"")+'>'+escH(t.name)+' · '+escH(t.category||"")+'</option>';
  }).join("");
  // INVARIANT: never silently drop a concrete selected template. If the catalog
  // has not loaded yet, or does not contain the selected template for this aspect,
  // still render the concrete option as selected so the dropdown can NOT fall back
  // to "Ngẫu nhiên" on re-render. This is the real fix for "sync reverts to random".
  if(isConcrete&&!found){
    opts='<option value="'+escH(sel)+'" selected>'+escH(sel)+'</option>'+opts;
  }
  return def+opts;
}
var MOTION_LABELS={"random":"🎲 Random","typewriter":"Typewriter","count_up":"Count up","flow_lines":"Flow lines","slide_up":"Slide up","zoom_mesh":"Zoom mesh"};
var ASSET_LABELS={"random":"🎲 Random","none":"Không ảnh","article_only":"Ảnh bài viết","manual":"Ảnh thủ công"};
function opts(map,val){var cur=val||"random";return Object.keys(map).map(function(k){return '<option value="'+k+'" '+(k===cur?'selected':'')+'>'+map[k]+'</option>';}).join('');}
function loadStoryboard(){
  // Template catalog loads async. Render scene cards only after the catalog is
  // available; otherwise the template dropdown falls back to only "Ngẫu nhiên".
  hvLoadTemplates(function(){
  fetch("/api/storyboard/"+ST.jobId).then(function(r){return r.json()}).then(function(d){
    if(d.error){$("sbScenes").innerHTML='<div class="text-[12px]" style="color:#ffb4ab">'+escH(d.error)+'</div>';return;}
    $("sbMeta").textContent=d.scenes.length+" cảnh · "+(d.total_duration||0)+"s";
    $("sbScenes").innerHTML=d.scenes.map(function(s,i){
      var img=s.image?("/api/storyboard/"+ST.jobId+"/asset/"+s.image.split("/").pop()+"?t="+Date.now()):"";
      var prev=(s.preview&&s.preview.png)?("/api/storyboard/"+ST.jobId+"/asset/"+s.preview.png.split("/").pop()+"?t="+Date.now()):"";
      var thumb=prev?'<img src="'+prev+'" style="width:128px;height:100%;min-height:150px;object-fit:cover;border-radius:14px;flex-shrink:0;align-self:stretch;border:1px solid rgba(255,255,255,.12)">':(img?'<img src="'+img+'" style="width:128px;height:100%;min-height:150px;object-fit:cover;border-radius:14px;flex-shrink:0;align-self:stretch;opacity:.75">':'<div style="width:128px;min-height:150px;border-radius:14px;background:linear-gradient(135deg,rgba(103,221,255,.12),rgba(159,140,255,.10));display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:stretch;font-size:11px;color:#9aa8ac;text-align:center;padding:10px">HTML<br>motion<br>scene</div>');
      return '<div class="flex items-stretch p-3 rounded-lg" style="gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);align-items:stretch">'+
        thumb+
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between">'+
          '<div class="flex items-center gap-2 mb-1"><span class="text-[10px] font-bold" style="color:#44d8f1">CẢNH '+(i+1)+'</span>'+
          '<span class="text-[10px]" style="color:#869396">'+s.duration+'s · '+(VISUAL_LABELS[s.visual_type]||s.visual_type||"")+' · '+(s.preview&&s.preview.status?s.preview.status:"pending")+'</span></div>'+
          '<input class="glass-input sb-headline mb-1" style="font-size:12px;width:100%" data-sid="'+s.id+'" value="'+escH(s.headline||'')+'" placeholder="Headline cảnh">'+
          '<textarea class="glass-input sb-text" rows="3" style="font-size:12px;width:100%;flex:1;min-height:74px" data-sid="'+s.id+'">'+escH(s.text)+'</textarea>'+
          '<div class="grid grid-cols-3 gap-1 mt-1">'+
            '<select class="glass-input sb-visual" data-sid="'+s.id+'" style="font-size:11px;padding:6px">'+opts(VISUAL_LABELS,s.visual_type||"random")+'</select>'+
            '<select class="glass-input sb-motion" data-sid="'+s.id+'" style="font-size:11px;padding:6px">'+opts(MOTION_LABELS,s.motion_preset||"random")+'</select>'+
            '<select class="glass-input sb-asset" data-sid="'+s.id+'" style="font-size:11px;padding:6px">'+opts(ASSET_LABELS,s.asset_policy||"random")+'</select>'+
          '</div>'+
          '<div class="flex items-center gap-1 mt-1">'+
            '<span class="text-[10px]" style="color:#869396;white-space:nowrap">Template</span>'+
            '<select class="glass-input sb-template" data-sid="'+s.id+'" style="font-size:11px;padding:6px;flex:1">'+hvTemplateOptions(s.template_id)+'</select>'+
            '<button onclick="sbRandomTpl(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px] border border-white/15 hover:bg-white/10" title="Chọn template ngẫu nhiên">🎲</button>'+
          '</div>'+
          '<div class="flex gap-1 mt-1 flex-wrap">'+
            '<button onclick="sbRenderVideo(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px]" style="border:1px solid rgba(103,221,255,.4);background:rgba(103,221,255,.12);color:#9beeff">🎬 Render video cảnh</button>'+
            '<button onclick="sbPreview(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px] border border-white/15 hover:bg-white/10">🖼 Ảnh preview</button>'+
            '<button onclick="sbRegen(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px] border border-white/15 hover:bg-white/10">🔄 Ảnh bài viết</button>'+
            '<button onclick="sbSave(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px] border border-white/15 hover:bg-white/10">💾 Lưu</button>'+
            '<button onclick="sbSyncSettings(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px]" style="border:1px solid rgba(242,196,109,.42);background:rgba(242,196,109,.12);color:#f2c46d" title="Khóa setting cảnh này và đồng bộ sang các cảnh còn lại">🔒 Đồng bộ</button>'+
            '<button onclick="sbDel(\''+s.id+'\')" class="px-2 py-1 rounded text-[10px] border border-white/15 hover:bg-white/10" style="color:#ff8da1">🗑</button>'+
          '</div>'+
          '<div class="mt-1 text-[10px]" style="color:#829096">Keywords: '+escH((s.keywords||[]).slice(0,4).join(', '))+' · Số liệu: '+escH((s.numbers||[]).slice(0,3).join(', '))+'</div>'+
          '<div id="prev_'+s.id+'" class="mt-2"></div>'+
        '</div></div>';
    }).join("");
  }).catch(function(e){$("sbScenes").innerHTML='<div style="color:#ffb4ab">Lỗi: '+escH(e.message)+'</div>';});
  });
}
function sbPayload(sid){
  var ta=document.querySelector('textarea.sb-text[data-sid="'+sid+'"]');
  var hd=document.querySelector('input.sb-headline[data-sid="'+sid+'"]');
  var vt=document.querySelector('select.sb-visual[data-sid="'+sid+'"]');
  var mt=document.querySelector('select.sb-motion[data-sid="'+sid+'"]');
  var ap=document.querySelector('select.sb-asset[data-sid="'+sid+'"]');
  var tp=document.querySelector('select.sb-template[data-sid="'+sid+'"]');
  return {job_id:ST.jobId,scene_id:sid,text:ta?ta.value.trim():"",headline:hd?hd.value.trim():null,visual_type:vt?vt.value:null,motion_preset:mt?mt.value:null,asset_policy:ap?ap.value:null,template_id:tp?tp.value:null};
}
function sbSaveRaw(sid){
  return fetch("/api/storyboard/scene/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sbPayload(sid))})
    .then(function(r){return r.json()});
}
function sbSave(sid){
  sbSaveRaw(sid).then(function(d){toast(d.success?"Đã lưu scene":"Lỗi lưu",!d.success);loadStoryboard();});
}
function sbSyncSettings(sid){
  var payload=sbPayload(sid);
  // Save source scene first, then sync exactly the saved settings. This prevents
  // "changed dropdown -> sync" from reading stale storyboard state or falling back to random.
  sbSaveRaw(sid).then(function(d){
    if(d.error||!d.success)throw new Error(d.error||"Lỗi lưu scene nguồn trước khi đồng bộ");
    return fetch("/api/storyboard/scene/sync-settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  }).then(function(r){return r.json()}).then(function(d){
    if(d.error)throw new Error(d.error);
    saveProgress("checkpoint");
    toast("Đã lưu nguồn + đồng bộ setting sang "+d.synced+" cảnh");
    loadStoryboard();
  }).catch(function(e){toast("Lỗi đồng bộ: "+e.message,1);});
}

function sbRegen(sid){
  toast("Đang tải ảnh mới...");
  fetch("/api/storyboard/scene/regenerate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:ST.jobId,scene_id:sid})})
    .then(function(r){return r.json()}).then(function(d){toast(d.success?"Đã đổi ảnh":"Không tìm được ảnh khác",!d.success);loadStoryboard();});
}
function sbPreview(sid){
  var box=$("prev_"+sid); if(box)box.innerHTML='<div class="text-[10px] text-on-surface-variant">Đang render preview cảnh...</div>';
  fetch("/api/storyboard/scene/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:ST.jobId,scene_id:sid})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      if(box)box.innerHTML='<img src="'+d.preview+'" style="width:100%;max-height:360px;object-fit:contain;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#050713">';
      toast("Đã render preview cảnh");
    }).catch(function(e){if(box)box.innerHTML='<div style="color:#ffb4ab;font-size:11px">Lỗi preview: '+escH(e.message)+'</div>';toast("Lỗi preview: "+e.message,1);});
}
function sbRandomTpl(sid){
  if(!HV_TEMPLATES.length){toast("Chưa tải template",1);return;}
  var sel=document.querySelector('select.sb-template[data-sid="'+sid+'"]');
  var pick=HV_TEMPLATES[Math.floor(Math.random()*HV_TEMPLATES.length)];
  if(sel&&pick){
    sel.value=pick.id;
    sbSaveRaw(sid).then(function(){toast("Random + đã lưu: "+pick.name);}).catch(function(e){toast("Lỗi lưu random: "+e.message,1);});
  }
}
function sbRenderVideo(sid){
  var tp=document.querySelector('select.sb-template[data-sid="'+sid+'"]');
  var tid=tp?tp.value:"random";
  var box=$("prev_"+sid);
  if(box)box.innerHTML='<div class="text-[10px]" style="color:#9beeff">Đang render video cảnh bằng html-video engine... (có thể mất ~30-60s)</div>';
  fetch("/api/hv/scene/render",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:ST.jobId,scene_id:sid,template_id:tid,aspect:"9:16",voice:ST.voice})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error);
      if(box)box.innerHTML='<div class="text-[10px] mb-1" style="color:#9beeff">Template: '+escH(d.template_id)+' · '+escH(d.aspect)+'</div>'+
        '<video src="'+d.mp4+'" controls autoplay muted loop playsinline style="width:100%;max-height:420px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#050713"></video>';
      toast("Đã render video cảnh: "+d.template_id);
    }).catch(function(e){if(box)box.innerHTML='<div style="color:#ffb4ab;font-size:11px">Lỗi render: '+escH(e.message)+'</div>';toast("Lỗi render: "+e.message,1);});
}
function sbDel(sid){
  fetch("/api/storyboard/scene/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:ST.jobId,scene_id:sid})})
    .then(function(r){return r.json()}).then(function(d){toast(d.success?"Đã xóa cảnh":"Lỗi",!d.success);loadStoryboard();});
}
function sbAdd(){
  fetch("/api/storyboard/scene/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job_id:ST.jobId,text:"Phân cảnh mới - nhập lời rồi render preview"})})
    .then(function(r){return r.json()}).then(function(d){toast(d.success?"Đã thêm cảnh":"Lỗi",!d.success);loadStoryboard();});
}

function sbRender(){
  var btn=$("sbRenderBtn");btn.disabled=true;btn.innerHTML="Đang ghép...";
  $("renderProgress").style.display="block";
  fetch("/api/storyboard/"+ST.jobId+"/render",{method:"POST"}).then(function(r){return r.json()}).then(function(d){
    if(d.error){toast(d.error,1);btn.disabled=false;btn.innerHTML="🎬 Ghép video";return;}
    var t0=Date.now();
    var iv=setInterval(function(){
      if(Date.now()-t0>180000){clearInterval(iv);toast("Quá thời gian ghép",1);btn.disabled=false;btn.innerHTML="🎬 Ghép video";return;}
      fetch("/api/jobs/"+ST.jobId).then(function(r){return r.json()}).then(function(j){
        $("rpFill").style.width=(j.progress||70)+"%";
        $("rpText").textContent="Đang ghép... "+(j.progress||70)+"%";
        if(j.status==="done"){clearInterval(iv);showResult(j);}
        else if(j.status==="error"){clearInterval(iv);toast(j.error||"Lỗi ghép",1);btn.disabled=false;btn.innerHTML="🎬 Ghép video";}
      }).catch(function(){});
    },2500);
  }).catch(function(e){toast("Lỗi: "+e.message,1);btn.disabled=false;btn.innerHTML="🎬 Ghép video";});
}
function showResult(j){
  $("renderProgress").style.display="none";
  var vp=j.video_path||(j.result&&j.result.video_path);
  var box=$("resultBox");box.style.display="block";
  box.innerHTML='<div class="text-[13px] font-bold mb-2" style="color:#5ee3a1">✅ Video hoàn tất</div>'+
    '<video src="/output/'+vp+'" controls style="width:100%;max-height:60vh;border-radius:12px"></video>'+
    '<div class="flex gap-2 mt-2"><a href="/output/'+vp+'" download class="px-4 py-2 rounded-full bg-primary text-black text-[12px] font-bold">📥 Tải về</a>'+
    '<button onclick="resetWizard()" class="px-4 py-2 rounded-full border border-white/15 text-on-surface-variant text-[12px]">+ Video mới</button></div>';
  toast("Video hoàn tất!");
}
function resetWizard(){
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  ST.step=1;ST.url="";ST.title="";ST.content="";ST.jobId="";ST._origContent="";
  setStep(1);
  saveProgress("checkpoint");
}
function goApiKeys(){window.location.href="/apikeys.html";}
function toggleHelp(){var h=$("helpOverlay");if(h)h.classList.toggle("hidden");}

// ---- init ----
function llmCurLabel(){
  var p=(ST.llmProviders||[]).filter(function(x){return x.id===ST.llmProvider})[0];
  return p?p.label:(ST.llmProvider||"Local");
}
function llmPickerHtml(ctx){
  var provOpts=(ST.llmProviders||[]).map(function(p){
    return '<option value="'+p.id+'"'+(p.id===ST.llmProvider?" selected":"")+'>'+escH(p.label)+'</option>';
  }).join("");
  var needBase=((ST.llmProviders||[]).filter(function(x){return x.id===ST.llmProvider})[0]||{}).needs_base_url;
  return '<div class="p-3 rounded-lg mb-3" style="background:rgba(103,221,255,.06);border:1px solid rgba(103,221,255,.25)">'+
    '<div class="flex items-center gap-2 mb-2"><span class="text-[12px] font-bold" style="color:#67ddff">🧠 LLM</span>'+
      '<span class="text-[10px] text-on-surface-variant">chọn nơi xử lý nội dung (Local chạy offline, còn lại cần key ở trang API Keys)</span></div>'+
    '<div class="grid grid-cols-2 gap-2">'+
      '<select id="llmProv_'+ctx+'" class="glass-input" style="font-size:12px" onchange="onLlmPick(\''+ctx+'\')">'+provOpts+'</select>'+
      '<input id="llmModel_'+ctx+'" class="glass-input" style="font-size:12px" placeholder="model (trống = mặc định)" value="'+escH(ST.llmModel||"")+'" oninput="ST.llmModel=this.value">'+
    '</div>'+
    (needBase?'<input id="llmBase_'+ctx+'" class="glass-input mt-2" style="font-size:12px;font-family:monospace" placeholder="Base URL vd: http://192.168.1.8:20128/v1" value="'+escH(ST.llmBaseUrl||"")+'" oninput="ST.llmBaseUrl=this.value">':'')+
    '<div class="flex justify-end mt-2"><button onclick="llmSaveTest(\''+ctx+'\')" class="px-3 py-1 rounded text-[11px] border border-white/15 hover:bg-white/10">⚡ Lưu + Test</button></div>'+
  '</div>';
}
function onLlmPick(ctx){
  var sel=$("llmProv_"+ctx); if(sel)ST.llmProvider=sel.value;
  var m=$("llmModel_"+ctx); if(m)ST.llmModel=m.value;
  render();
}
function llmBody(){return {llm_provider:ST.llmProvider,llm_model:(ST.llmModel||"").trim(),llm_base_url:(ST.llmBaseUrl||"").trim()};}
function llmSaveTest(ctx){
  var m=$("llmModel_"+ctx); if(m)ST.llmModel=m.value;
  var b=$("llmBase_"+ctx); if(b)ST.llmBaseUrl=b.value;
  toast("Đang lưu + test LLM...");
  fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(llmBody())})
    .then(function(r){return r.json()}).then(function(){
      return fetch("/api/llm/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(llmBody())});
    }).then(function(r){return r.json()}).then(function(d){toast((d.success?"✅ Đã lưu + LLM OK ":"❌ ")+(d.detail||""),!d.success);})
    .catch(function(e){toast("Lỗi: "+e.message,1);});
}
function loadLlmConfig(){
  return Promise.all([
    fetch("/api/llm/providers").then(function(r){return r.json()}).catch(function(){return{providers:[]}}),
    fetch("/api/settings").then(function(r){return r.json()}).catch(function(){return{}})
  ]).then(function(res){
    ST.llmProviders=(res[0].providers)||[];
    var st=res[1]||{};
    if(st.llm_provider)ST.llmProvider=st.llm_provider;
    ST.llmModel=st.llm_model||"";
    ST.llmBaseUrl=st.llm_base_url||"";
  });
}
function initApp(){
  fetch("/healthz").then(function(r){return r.json()}).then(function(d){var v=$("appVersion");if(v)v.textContent="v"+(d.version||"?");}).catch(function(){});
  loadLlmConfig();
  Promise.all([
    fetch("/api/voices").then(function(r){return r.json()}).catch(function(){return{voices:[]}}),
    fetch("/api/bgm-files").then(function(r){return r.json()}).catch(function(){return{builtins:[]}})
  ]).then(function(res){
    ST.voices=(res[0].voices)||[];
    ST.bgms=(res[1].builtins)||[];
    var lastVoice="";try{lastVoice=localStorage.getItem("xvideo:lastVoice")||"";}catch(e){}
    if(ST.voices.length){var ok=ST.voices.some(function(v){return v.id===lastVoice});ST.voice=ok?lastVoice:ST.voices[0].id;}
    if(ST.bgms.length)ST.music=ST.bgms[0].id;
    var restored=false;
    try{var snap=JSON.parse(localStorage.getItem(STORE_KEY)||"null");
      if(snap&&snap.state&&(snap.state.content||snap.state.url||snap.state.jobId)){ST=Object.assign(ST,snap.state); restored=true;}
    }catch(e){}
    setStep(ST.step||1);
    if(restored)toast("Đã khôi phục tiến trình đang làm");
  });
}
document.addEventListener("DOMContentLoaded",initApp);
</script>
